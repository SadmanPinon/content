<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Sarvam transcription workflow in Daytona</title>
  <desc id="desc">A workflow showing a Daytona workspace running Sapat, converting video to MP3, sending audio to Sarvam AI, and saving a transcript.</desc>
  <rect width="1280" height="640" fill="#101820"/>
  <rect x="72" y="80" width="1136" height="480" rx="18" fill="#f7f9fb"/>
  <text x="112" y="140" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Run Sarvam Speech-to-Text with Sapat in Daytona</text>
  <text x="112" y="184" fill="#425466" font-family="Inter, Arial, sans-serif" font-size="20">A reproducible workspace keeps provider setup, source changes, and validation steps together.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="112" y="250" width="210" height="130" rx="12" fill="#e9f2ff" stroke="#2563eb" stroke-width="2"/>
    <text x="152" y="305" fill="#123876" font-size="24" font-weight="700">Daytona</text>
    <text x="142" y="338" fill="#315174" font-size="17">Workspace</text>
    <rect x="392" y="250" width="210" height="130" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="456" y="305" fill="#8a3b08" font-size="24" font-weight="700">Sapat</text>
    <text x="426" y="338" fill="#7b4a1d" font-size="17">ffmpeg to MP3</text>
    <rect x="672" y="250" width="210" height="130" rx="12" fill="#ecfdf3" stroke="#16a34a" stroke-width="2"/>
    <text x="724" y="305" fill="#166534" font-size="24" font-weight="700">Sarvam AI</text>
    <text x="700" y="338" fill="#276749" font-size="17">Saaras v3 REST API</text>
    <rect x="952" y="250" width="210" height="130" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1004" y="305" fill="#4c1d95" font-size="24" font-weight="700">Transcript</text>
    <text x="990" y="338" fill="#5b21b6" font-size="17">Saved as .txt</text>
    <path d="M332 315 H382" stroke="#101820" stroke-width="4" stroke-linecap="round"/>
    <path d="M374 305 L388 315 L374 325" fill="none" stroke="#101820" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M612 315 H662" stroke="#101820" stroke-width="4" stroke-linecap="round"/>
    <path d="M654 305 L668 315 L654 325" fill="none" stroke="#101820" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M892 315 H942" stroke="#101820" stroke-width="4" stroke-linecap="round"/>
    <path d="M934 305 L948 315 L934 325" fill="none" stroke="#101820" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="112" y="438" width="1056" height="58" rx="10" fill="#101820"/>
  <text x="142" y="475" fill="#f7f9fb" font-family="Menlo, Consolas, monospace" font-size="19">sapat ./clips --api sarvam --language unknown --quality M</text>
</svg>
